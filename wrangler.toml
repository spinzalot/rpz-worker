# RedditPZ challenge features, developed in their own account and shaped to merge into
# sourdoughrides.com's Worker later (see README).
name = "rpz-worker"
main = "src/index.ts"
compatibility_date = "2026-08-15"

[[d1_databases]]
binding = "RPZ_DB"
database_name = "rpz"
database_id = "da700b4d-52c9-40c4-a214-c11f3d3b4ee0"
migrations_dir = "migrations"

[vars]
RPZ_ENABLED = "true"
GOOGLE_CLIENT_ID = "971118752046-16hom4b3b76gqamdhhi7tjahdjb8ri59.apps.googleusercontent.com"
# Comma-separated origins allowed to call the API from a browser (the GitHub Pages page, for now).
ALLOWED_ORIGINS = "https://spinzalot.github.io"
STRAVA_CLIENT_ID = "298650"
DISCORD_CLIENT_ID = "1574563901864157224"
DISCORD_REDIRECT_URI = "https://spinzalot.github.io/redditpz/"
# Secrets (Cloudflare dashboard or `npx wrangler secret put`): SESSION_SECRET, DISCORD_CLIENT_SECRET
# STRAVA_CLIENT_SECRET is a secret: npx wrangler secret put STRAVA_CLIENT_SECRET

[observability]
enabled = true
